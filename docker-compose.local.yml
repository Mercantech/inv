services:
  api:
    environment:
      ALLOW_LOAN_TESTING_WITHOUT_ROLE: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    labels:
      - "traefik.enable=false"

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-inv}-local
    external: false
