; PlatformIO Project Configuration File
; Arduino Opla / MKR WiFi 1010 + MKR IoT Carrier

[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
monitor_speed = 9600
lib_deps =
  arduino-libraries/Arduino_MKRIoTCarrier @ ^2.0.0
  arduino-libraries/WiFiNINA @ ^2.0.0
  arduino-libraries/ArduinoECCX08 @ ^1.3.8
